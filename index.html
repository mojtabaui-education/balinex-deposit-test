<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کنسول تست واریز بالینکس</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.85 var(--font);
  background-image:radial-gradient(900px 340px at 85% -80px,color-mix(in srgb,var(--pri) 11%,transparent),transparent 70%)}
b,strong,summary{font-weight:700}
h1,h2{font-family:var(--font)}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header h1{margin:0;margin-inline-end:auto;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
header h1::before{content:"";width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 0 0 4px var(--pri-soft)}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
nav button{background:none;border:0;color:var(--mute);padding:7px 14px;border-radius:9px;cursor:pointer;font:500 14px var(--font);transition:.15s}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(24,29,53,.12);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:16.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--pri),var(--pri2))}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}main{padding:14px 12px 50px}}
label{display:block;font-size:13.5px;font-weight:500;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;font:400 15px var(--font);color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--pri-soft)}
input[dir=ltr],input[readonly]{font-family:Consolas,ui-monospace,monospace;direction:ltr;text-align:left;font-size:13px}input[readonly]{color:var(--pri)}
input[type=checkbox]{width:auto;accent-color:var(--pri)}
textarea{min-height:64px;resize:vertical}
a{color:var(--pri)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px}
button.btn{font:500 14.5px var(--font);cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:11px;transition:.15s}
button.btn:hover,label.btn:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}
label.btn{display:inline-block;font:500 14.5px var(--font);cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:11px;margin:0;transition:.15s}
button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);border-color:transparent;font-weight:700;box-shadow:0 6px 16px -8px var(--pri)}
button.pri:hover{color:var(--pri-ink);border-color:transparent;filter:brightness(1.07)}
button.danger{color:var(--bad)}button.danger:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 13px;border-radius:99px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px}
.pA{background:var(--a)}.pB{background:var(--b)}
.mute{color:var(--mute);font-size:13.5px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--mute);font-weight:700;font-size:13px;background:var(--soft)}
th:first-child{border-start-start-radius:10px}th:last-child{border-start-end-radius:10px}
tbody tr:last-child td,table tr:last-child td{border-bottom:0}
tr.sel{background:var(--pri-soft)}
.timer{font:800 56px/1.2 var(--font);font-variant-numeric:tabular-nums;direction:ltr;text-align:center;letter-spacing:2px;margin:4px 0 10px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.timer.over{background:none;color:var(--bad)}
.script{background:var(--soft);border-inline-start:4px solid var(--pri);padding:11px 15px;border-radius:12px;margin:8px 0;white-space:pre-wrap}
details{border-bottom:1px dashed var(--line);padding:4px 0}details:last-child{border:0}
summary{cursor:pointer;padding:6px 0;color:var(--ink)}
summary::marker{color:var(--pri)}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.log{max-height:180px;overflow:auto;font-size:13.5px;margin-top:10px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.verdict{font-size:22px;font-weight:800;padding:16px 20px;border-radius:14px;border:2px solid var(--line);background:var(--soft)}
.v-keep{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.v-del{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.v-def{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
iframe{width:100%;height:640px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}.chk input{margin-top:9px}
.hide{display:none!important}
.big{font-size:28px;font-weight:800}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
</style>
</head>
<body>
<header>
  <h1>کنسول تست واریز · بالینکس</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script src="config.js"></script>
<script>
/* ---------- state ---------- */
const KEY='balinex-deposit-test-v1';
const DEF={config:{urlA:'',urlB:'',defaultDecision:'',approver:'',approvedDate:'',gap:2,locked:false},participants:[],sel:null,tab:'setup',showVer:false,embed:false};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(DEF)}catch(e){S=structuredClone(DEF)}
S.config={...DEF.config,...S.config};
const TC=window.TEST_CONFIG||{};if(!S.config.urlA&&TC.urlA)S.config.urlA=TC.urlA;if(!S.config.urlB&&TC.urlB)S.config.urlB=TC.urlB;
const base=location.href.replace(/[^/]*$/,'')+'go.html?c=';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=()=>S.participants.find(p=>p.id===S.sel);
const real=()=>S.participants.filter(p=>!p.pilot);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const mmss=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------- tabs ---------- */
const TABS=[['setup','۱ · قاعده و راه‌اندازی'],['people','۲ · شرکت‌کننده‌ها'],['run','۳ · اجرای جلسه'],['res','۴ · نتیجه و تصمیم']];
function renderNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;save();render()}}}

/* ---------- randomisation (stratified by prior deposit experience) ---------- */
function assign(exp,pilot){
  const pool=S.participants.filter(p=>!p.pilot===!pilot&&!pilot);
  if(pilot){return S.participants.filter(p=>p.pilot).length%2?'B':'A'}
  const cnt=(v,filter)=>real().filter(p=>p.version===v&&filter(p)).length;
  const A=cnt('A',()=>true),B=cnt('B',()=>true);
  if(A>=6)return 'B'; if(B>=6)return 'A';
  const sa=cnt('A',p=>p.exp===exp),sb=cnt('B',p=>p.exp===exp);
  if(sa!==sb)return sa<sb?'A':'B';
  if(A!==B)return A<B?'A':'B';
  return Math.random()<.5?'A':'B';
}

/* ---------- invitation text (does not reveal the version) ---------- */
const invite=link=>`سلام! 👋
ممنون که برای تست طرح صفحهٔ واریز بالینکس وقت می‌ذاری.

⏱ حدود ۵ دقیقه طول می‌کشه
💳 فقط یه نمونهٔ آزمایشیه؛ لازم نیست پولی منتقل کنی یا اطلاعات بانکی بدی
💻 اگه می‌تونی، لینک رو روی کامپیوتر باز کن

لینک تست:
${link}

ما طرح رو می‌سنجیم، نه تو رو؛ جواب درست یا غلط وجود نداره. هر سؤالی داشتی همین‌جا بپرس. مرسی از کمکت!`;

/* ---------- views ---------- */
function render(){renderNav();({setup:vSetup,people:vPeople,run:vRun,res:vRes}[S.tab])()}

function vSetup(){
  const c=S.config,L=c.locked;
  $('#app').innerHTML=`
  <div class="card"><h2>قاعدهٔ تصمیم (بند ۳ سند) — قبل از جذب شرکت‌کننده‌ها قفل شود</h2>
   <p class="mute">با قفل‌شدن، ثبت شرکت‌کنندهٔ واقعی فعال می‌شود و این بخش دیگر قابل‌ویرایش نیست.</p>
   <div class="script"><b>نگه‌داشتن:</b> دست‌کم ۳ نفر از ۶ نفر گروه B بدون راهنمایی توضیح دهند فیلد به فهم قدم بعدی کمک کرده، و تعداد افرادی که مکث/برگشت/درخواست کمک داشتند در B بیشتر از A نباشد.
<b>حذف:</b> دست‌کم ۲ نفر از B فیلد را اجباری تصور کنند، برای پرکردنش مکث کنند یا انتظار ثبت/بررسی مبلغ داشته باشند؛ یا B به‌طور مشخص کمک/برگشت بیشتری از A لازم داشته باشد.
<b>مساوی/نامشخص:</b> تصمیم پیش‌فرض.</div>
   <div class="grid g2">
    <div><label>تصمیم پیش‌فرض برای حالت مساوی/نامشخص *</label>
     <select id="def" ${L?'disabled':''}><option value="">— انتخاب کنید —</option>
      ${['نگه‌داشتن فیلد','حذف فیلد'].map(o=>`<option ${c.defaultDecision===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div><label>«به‌طور مشخص بیشتر» یعنی چند نفر اختلاف (تعداد افراد دارای مکث/برگشت/کمک، B منهای A)</label>
     <input id="gap" type="number" min="1" max="6" value="${c.gap}" ${L?'disabled':''}>
     <div class="mute">فرض من: ۲ نفر. سند عدد را مشخص نکرده؛ قبل از قفل با تیم نهایی شود.</div></div>
    <div><label>تأییدکننده *</label><input id="appr" value="${esc(c.approver)}" ${L?'disabled':''}></div>
    <div><label>تاریخ *</label><input id="adate" value="${esc(c.approvedDate)}" placeholder="مثلاً ۱۴۰۵/۰۸/۲۴" ${L?'disabled':''}></div>
   </div>
   <p class="mute">اگر هر دو شرط «نگه‌داشتن» و «حذف» هم‌زمان برقرار شوند، سند تکلیفی نگفته؛ کنسول آن را «تعارض» نشان می‌دهد و تصمیم پیش‌فرض اعمال می‌شود.</p>
   <div class="row"><button class="btn pri" id="lock" ${L?'disabled':''}>${L?'قفل شده ✓':'تأیید و قفل قاعده'}</button>
   ${L?`<button class="btn danger" id="unlock">باز کردن قفل (فقط پیش از جلسهٔ واقعی)</button>`:''}</div>
  </div>
  <div class="card"><h2>لینک پروتوتایپ‌ها</h2>
   <p class="mute">لینک‌های مخصوص تست (رابط فیگما مخفی، نقاط کلیک خاموش) را بگذارید. اگر لینک <code>figma.com/proto</code> باشد، برای نمایش داخلی به حالت embed تبدیل می‌شود.</p>
   <div class="grid g2"><div><label>نسخهٔ A (بدون فیلد)</label><input id="uA" dir="ltr" value="${esc(c.urlA)}"></div>
   <div><label>نسخهٔ B (با فیلد)</label><input id="uB" dir="ltr" value="${esc(c.urlB)}"></div></div>
   <p class="mute">فایل طراحی: <a href="https://www.figma.com/design/gBIhqkV3ZxTIiVsNJlfBA8/Wallet---Redesign?node-id=12158-16458" target="_blank" rel="noopener">Wallet — Redesign</a></p>
  </div>
  <div class="card"><h2>لینک ارسال به شرکت‌کننده‌ها</h2>
   <p class="mute">فقط پروتوتایپ را نشان می‌دهد؛ نام نسخه در صفحه نیست. لینک هر نسخه را به شرکت‌کنندهٔ همان نسخه بدهید. لینک پروتوتایپ‌ها باید در config.js هم ثبت شود.</p>
   ${['A','B'].map(v=>{const link=base+((v==='A'?TC.codeA:TC.codeB)||'');return `
   <label>نسخهٔ ${v}</label><div class="row"><input readonly dir="ltr" style="flex:1;min-width:220px" value="${esc(link)}" onclick="this.select()"><button class="btn" data-copy="${esc(link)}">کپی لینک</button></div>
   <textarea readonly rows="7" style="margin-top:8px" id="inv${v}">${esc(invite(link))}</textarea>
   <div class="row" style="margin-top:6px"><button class="btn pri" data-copy-el="inv${v}">کپی متن دعوت نسخهٔ ${v}</button></div>`}).join('')}</div>
  <div class="card"><h2>پیش از شروع (بند ۴ و ۶ سند)</h2>
   <p class="mute">تیک‌ها ذخیره می‌شوند.</p>
   ${[['pre1','هر دو لینک را با ۱۳ گام جدول بند ۴ امتحان کردم و نتیجه‌ها مطابق انتظار بود'],['pre2','برای هر نسخه یک اجرای آزمایشی گرفتم (در برنامه با تیک «آزمایشی» ثبت شود و وارد مقایسه نمی‌شود)'],['pre3','لینک/متن مأموریت/برگه نیاز به اصلاحی نداشت (یا اصلاح شد)'],['pre4','۱۲ شرکت‌کننده (۶ نفر در هر نسخه) از کاربران فعلی یا بالقوه جذب شده‌اند']]
    .map(([k,t])=>`<label class="chk" style="color:var(--ink);font-size:14px"><input type="checkbox" data-pre="${k}" ${S.pre?.[k]?'checked':''}>${t}</label>`).join('')}
  </div>
  <div class="card"><h2>داده</h2><div class="row">
   <button class="btn" id="exj">خروجی JSON</button><button class="btn" id="exc">خروجی CSV</button>
   <label class="btn" style="margin:0">ورود JSON<input type="file" id="imp" accept=".json" class="hide"></label>
   <label class="btn" style="margin:0">ورود نتایج شرکت‌کننده‌ها (JSON)<input type="file" id="impr" accept=".json" class="hide"></label><button class="btn pri" id="pull">دریافت نتایج از اینترنت</button><button class="btn" id="paste">ورود کد نتیجه</button><button class="btn danger" id="reset">پاک‌کردن همه</button></div>
   <p class="mute">داده فقط در مرورگر همین سیستم ذخیره می‌شود. بعد از هر روز آزمون خروجی بگیرید.</p></div>`;
  if(!L){['def','gap','appr','adate'].forEach(id=>$('#'+id).onchange=()=>{c.defaultDecision=$('#def').value;c.gap=+$('#gap').value||2;c.approver=$('#appr').value;c.approvedDate=$('#adate').value;save()})}
  const copy=(txt,btn)=>{const done=()=>{const o=btn.textContent;btn.textContent='کپی شد ✓';setTimeout(()=>btn.textContent=o,1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{});else{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done()}};
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
  document.querySelectorAll('[data-copy-el]').forEach(b=>b.onclick=()=>copy($('#'+b.dataset.copyEl).value,b));
  $('#uA').onchange=e=>{c.urlA=e.target.value.trim();save()};$('#uB').onchange=e=>{c.urlB=e.target.value.trim();save()};
  $('#lock').onclick=()=>{c.defaultDecision=$('#def').value;c.approver=$('#appr').value;c.approvedDate=$('#adate').value;c.gap=+$('#gap').value||2;
    if(!c.defaultDecision||!c.approver||!c.approvedDate)return alert('تصمیم پیش‌فرض، تأییدکننده و تاریخ را کامل کنید.');c.locked=true;save();render()};
  if($('#unlock'))$('#unlock').onclick=()=>{if(real().length&&!confirm('جلسهٔ واقعی ثبت شده؛ تغییر قاعده بعد از دیدن نتیجه اعتبار تست را از بین می‌برد. ادامه؟'))return;c.locked=false;save();render()};
  document.querySelectorAll('[data-pre]').forEach(i=>i.onchange=()=>{S.pre={...S.pre,[i.dataset.pre]:i.checked};save()});
  $('#exj').onclick=()=>dl('balinex-test.json',JSON.stringify(S,null,1),'application/json');
  $('#exc').onclick=()=>dl('balinex-test.csv','﻿'+toCSV(),'text/csv');
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();render()}catch(x){alert('فایل نامعتبر')}})};
  $('#impr').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let a=JSON.parse(t);if(!Array.isArray(a))a=[a];a.forEach(applyResult);save();alert(a.length+' نتیجه وارد شد. نتیجهٔ «کمک‌کنندگی فیلد»، «اجباری تصور کرد» و «انتظار از مبلغ» را باید خودتان از پاسخ‌ها کدگذاری کنید.');render()}catch(x){alert('فایل نامعتبر')}})};
  $('#pull').onclick=pullResults;
  $('#paste').onclick=()=>{const c=prompt('کد نتیجه را بچسبانید');if(!c)return;try{const m=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));alert(processMsgs(m)+' نتیجه وارد شد.');render()}catch(e){alert('کد نامعتبر')}};
  $('#reset').onclick=()=>{if(confirm('همهٔ داده پاک شود؟')){S=structuredClone(DEF);save();render()}};
}

function vPeople(){
  const c=S.config;
  $('#app').innerHTML=`
  ${!c.locked?`<div class="card warn">قاعدهٔ تصمیم هنوز قفل نشده؛ فقط اجرای آزمایشی مجاز است.</div>`:''}
  <div class="card"><h2>شرکت‌کنندهٔ جدید</h2>
   <div class="grid g3"><div><label>شناسه (مثلاً P01)</label><input id="code" value="P${String(real().length+1).padStart(2,'0')}"></div>
   <div><label>تجربهٔ قبلی واریز (برای متعادل‌سازی)</label><select id="exp"><option value="1">دارد</option><option value="0">ندارد</option></select></div>
   <div><label>نوع جلسه</label><select id="pil"><option value="0" ${c.locked?'':'disabled'}>اصلی</option><option value="1" ${c.locked?'':'selected'}>آزمایشی (خارج از مقایسه)</option></select></div></div>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="add">ثبت و تخصیص نسخه</button>
   <span class="mute">تخصیص تصادفی است و در هر لایهٔ تجربه تا حد ممکن متعادل می‌ماند؛ سقف ۶ نفر برای هر نسخه.</span></div></div>
  <div class="card"><h2>فهرست (${fa(real().length)} از ۱۲)</h2>
   <table><tr><th>نسخه</th><th>تجربه</th><th>نوع</th><th>نتیجه</th><th></th></tr>
   ${S.participants.map(p=>`<tr class="${p.id===S.sel?'sel':''}">

const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function applyResult(r){
  let p=S.participants.find(x=>x.code===r.p);
  if(!p){p={id:'p'+Date.now()+Math.random().toString(36).slice(2,5),code:r.p,version:r.v,exp:r.ex==='yes',pilot:false,obs:blank()};S.participants.push(p)}
  const o=p.obs;
  if(o.auto&&o.auto.ts===r.ts)return p;
  const a=r.a||{};
  o.outcome=r.o==='done'?'unassisted':'incomplete';
  if(r.o==='done')o.elapsed=r.e;
  const c=r.c||[];
  o.firstClick=c[0]?c[0][1]+' @'+c[0][0]+'s':(r.fb!=null?'تقریبی @'+Math.round(r.fb/1000)+'s':o.firstClick);
  Object.assign(o,{q1:a.q1||'',q2:a.q2||'',q3:a.q3||'',q4:a.q4||'',q5:a.q5||''});
  o.sq=r.sq?+r.sq:o.sq;
  o.events=(o.events||[]).filter(e=>e.note!=='خودگزارشی');if(r.tr==='yes')o.events.push({t:null,type:'pause',note:'خودگزارشی'});   // مکث/برگشت/سردرگمی که خود شرکت‌کننده گفته
  if(r.v==='B'){if(r.f)o.fieldUse=({yes:'used',no:'skipped'})[r.f]||r.f;if(r.m)o.mandatory=r.m;if(r.x)o.expectation=r.x;if(r.hp)o.helped=+r.hp>=4?'yes':'no'}   // کمک‌کنندگی: امتیاز ۴ یا ۵ از ۵
  o.auto={outcome:r.o,elapsed:r.e,clicks:r.cn||0,ts:r.ts,events:c.map(x=>({t:x[0],type:'click',note:x[1]}))};
  return p}
function processMsgs(msgs){const g={};
  msgs.forEach(m=>{if(!m||!m.p)return;const x=g[m.p+'|'+m.ts]=g[m.p+'|'+m.ts]||{a:{}};if(m.k)x.a[m.k]=m.t;else Object.assign(x,m)});
  let n=0;Object.values(g).forEach(r=>{if(r.v&&r.p){applyResult(r);n++}});save();return n}
async function pullResults(){const ep=TC.endpoint;if(!ep)return alert('endpoint در config.js تنظیم نشده.');
  try{const t=await (await fetch(ep+'/json?poll=1&since=all')).text();
    const msgs=t.split('\n').filter(Boolean).map(l=>{try{const e=JSON.parse(l);return e.event==='message'?JSON.parse(e.message):null}catch(x){return null}}).filter(Boolean);
    const n=processMsgs(msgs);alert(n+' نتیجه دریافت شد.');render()}catch(e){alert('دریافت ناموفق بود: '+e.message)}}

/* ---------- results ---------- */
const trouble=p=>p.obs.events.some(e=>['pause','pausefill','back','help'].includes(e.type));
const objection=p=>p.obs.mandatory==='yes'||p.obs.expectation==='recorded'||p.obs.events.some(e=>e.type==='pausefill');
const median=a=>{if(!a.length)return null;a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function stats(v){const g=real().filter(p=>p.version===v);
  const n=k=>g.filter(p=>p.obs.outcome===k).length;
  const t=g.filter(p=>p.obs.outcome==='unassisted'&&p.obs.elapsed!=null).map(p=>p.obs.elapsed);
  return{g,n:g.length,done:g.filter(p=>p.obs.outcome).length,unassisted:n('unassisted'),assisted:n('assisted'),incomplete:n('incomplete'),limit:n('limit'),med:median(t),tn:t.length,trouble:g.filter(trouble).length,
   mand:g.filter(p=>p.obs.mandatory==='yes').length,rec:g.filter(p=>p.obs.expectation==='recorded').length,objection:g.filter(objection).length,helped:g.filter(p=>p.obs.helped==='yes').length,ease:(()=>{const v=g.map(p=>+p.obs.sq).filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null})(),
   used:g.filter(p=>p.obs.fieldUse==='used').length,skipped:g.filter(p=>p.obs.fieldUse==='skipped').length,unseen:g.filter(p=>p.obs.fieldUse==='unseen').length}}

function decide(a,b){
  const c=S.config,final=a.done>=6&&b.done>=6;
  const keep=b.helped>=3&&b.trouble<=a.trouble;
  const del=b.objection>=2||(b.trouble-a.trouble>=c.gap);
  let res,why;
  if(keep&&del){res='تعارض → '+c.defaultDecision;why='هر دو شرط هم‌زمان برقرارند؛ سند تکلیفی نگفته، تصمیم پیش‌فرض اعمال شد. بهتر است تیم همین را رسمی کند.';}
  else if(keep){res='نگه‌داشتن فیلد';why='شرط نگه‌داشتن برقرار است.'}
  else if(del){res='حذف فیلد';why='شرط حذف برقرار است.'}
  else{res=c.defaultDecision+' (پیش‌فرض)';why='هیچ‌یک از دو شرط برقرار نیست.'}
  return{res,why,keep,del,final,cls:keep&&!del?'v-keep':del&&!keep?'v-del':'v-def'}}

function vRes(){
  const A=stats('A'),B=stats('B'),d=decide(A,B),c=S.config;
  const m=s=>s==null?'—':fa(s)+' ثانیه';
  const row=(l,a,b)=>`<tr><td>${l}</td><td>${a}</td><td>${b}</td></tr>`;
  $('#app').innerHTML=`
  <div class="card"><h2>تصمیم طبق قاعدهٔ قفل‌شده ${d.final?'':'<span class="warn">(موقت — جلسات کامل نیست)</span>'}</h2>
   ${c.locked?'':'<p class="warn">قاعده هنوز قفل نشده؛ نتیجه معتبر نیست.</p>'}
   <div class="verdict ${d.cls}">${esc(d.res)}</div><p class="mute">${d.why}</p>
   <table><tr><th>شرط</th><th>وضعیت</th></tr>
    <tr><td>نگه‌داشتن: B با توضیح بدون راهنما ≥ ۳ (الان ${fa(B.helped)}) و افراد دارای مکث/برگشت/کمک در B ≤ A (${fa(B.trouble)} در برابر ${fa(A.trouble)})</td><td class="${d.keep?'ok':'bad'}">${d.keep?'برقرار':'برقرار نیست'}</td></tr>
    <tr><td>حذف: B با اجباری/مکث پرکردن/انتظار ثبت ≥ ۲ (الان ${fa(B.objection)})، یا اختلاف مکث/برگشت/کمک B−A ≥ ${fa(c.gap)} (الان ${fa(B.trouble-A.trouble)})</td><td class="${d.del?'ok':'bad'}">${d.del?'برقرار':'برقرار نیست'}</td></tr></table>
   <p class="mute">این نمونه الگوی رفتاری را نشان می‌دهد؛ نتیجهٔ آماری یا اثر فیلد بر واریز واقعی نیست.</p></div>
  <div class="card"><h2>جمع‌بندی دو گروه (بدون جلسات آزمایشی)</h2>
   <table><tr><th></th><th><span class="pill pA">A</span></th><th><span class="pill pB">B</span></th></tr>
   ${row('جلسهٔ ثبت‌شده / تکمیل‌شده', fa(A.n)+' / '+fa(A.done), fa(B.n)+' / '+fa(B.done))}
   ${row('تکمیل بدون کمک',fa(A.unassisted),fa(B.unassisted))}
   ${row('تکمیل با کمک',fa(A.assisted),fa(B.assisted))}
   ${row('ناتمام',fa(A.incomplete),fa(B.incomplete))}
   ${row('محدودیت پروتوتایپ',fa(A.limit),fa(B.limit))}
   ${row('میانهٔ زمان (فقط تکمیل بدون کمک؛ n در پرانتز)',m(A.med)+' ('+fa(A.tn)+')',m(B.med)+' ('+fa(B.tn)+')')}
   ${row('افراد دارای مکث/برگشت/درخواست کمک',fa(A.trouble),fa(B.trouble))}
   ${row('فیلد: استفاده / رد / ندید','—',fa(B.used)+' / '+fa(B.skipped)+' / '+fa(B.unseen))}
   ${row('میانگین راحتی فرایند (۱ تا ۷، خودگزارشی)',A.ease==null?'—':fa(A.ease),B.ease==null?'—':fa(B.ease))}
   ${row('اجباری تصور کردند','—',fa(B.mand))}
   ${row('انتظار ثبت یا بررسی مبلغ','—',fa(B.rec))}
   ${row('فیلد را به فهم قدم بعدی کمک‌کننده دانستند','—',fa(B.helped))}
   </table></div>
  <div class="card"><h2>نمونه حرف‌ها (گروه B)</h2>
   ${B.g.filter(p=>p.obs.quote||p.obs.q3).map(p=>`<div class="script"><b>${esc(p.code)}</b>${p.obs.q3?' — «'+esc(p.obs.q3)+'»':''}${p.obs.quote?'<br>'+esc(p.obs.quote):''}</div>`).join('')||'<span class="mute">—</span>'}</div>`;
}

/* ---------- export ---------- */
function toCSV(){const h=['code','version','pilot','experience','outcome','elapsed_s','first_click','first_method','field_use','mandatory','expectation','helped','trouble','events','pause_note','quote','q1','q2','q3','q4','q5','auto_clicks','ease'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return [h.join(','),...S.participants.map(p=>{const o=p.obs;return [p.code,p.version,p.pilot?1:0,p.exp?1:0,o.outcome,o.elapsed,o.firstClick,o.firstMethod,o.fieldUse,o.mandatory,o.expectation,o.helped,trouble(p)?1:0,o.events.map(e=>`${e.t??''}s:${e.type}${e.note?'('+e.note+')':''}`).join(' | '),o.pauseNote,o.quote,o.q1,o.q2,o.q3,o.q4,o.q5,o.auto?o.auto.clicks:'',o.sq].map(q).join(',')})].join('\n')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}

render();
</script>
